# Premissas globais do valuation.
#
# Todos os valores sao nominais (a.a.), consistentes com projecoes em R$ correntes.
# Alterar este arquivo muda o resultado; o hash das premissas vai para o CSV.

# Taxa livre de risco: Swap DI 360x12 (BM&F), media recente.
rf: 0.105

# Premio de risco: ERP de mercado maduro (~4,5%) + premio de risco pais Brasil (~3,0%).
erp: 0.075

# Custo da divida usado quando a despesa financeira nao esta disponivel.
kd_fallback: 0.125

# Horizonte explicito de projecao e crescimento na perpetuidade (IPCA de longo prazo).
anos_projecao: 5
g_perpetuidade: 0.030

# Margem de seguranca aplicada ao piso da faixa (P25) para a recomendacao.
margem_seguranca: 0.25

# Acima deste upside absoluto o resultado e marcado como absurdo e sai do ranking.
upside_max: 0.90

# Convencao de meio de ano no desconto (mais aderente, mas conservadora na comparacao).
meio_ano: false

# Portao de atualidade do preco e validade do cache de dados.
dias_ultimo_pregao: 5
ttl_cache_dias: 1

# Quantidade de linhas na tabela do README.
top_readme: 20

# Beta desalavancado por setor (referencias de Damodaran, ajustadas para o Brasil).
# A comparacao ignora acentos e maiusculas.
beta_u_padrao: 0.85
beta_u_setorial:
  Financeiro: 0.55
  Utilidade Publica: 0.45
  Materiais Basicos: 0.90
  Consumo Ciclico: 0.85
  Consumo nao Ciclico: 0.65
  Bens Industriais: 0.80
  Saude: 0.70
  Tecnologia da Informacao: 0.95
  Comunicacoes: 0.75
  Petroleo. Gas e Biocombustiveis: 0.95

# Publica um segundo DCF alimentado pela previsao de receita, sem alterar o
# valuation oficial (que continua usando o crescimento historico).
publicar_modelo_receita: true

# Previsao de receita: dois modelos com variaveis independentes.
# "auto" escolhe por setor no backtest; os demais forcam um modelo.
previsao_receita:
  modelo: auto
  # Convergencia exponencial do crescimento ate a perpetuidade.
  amortecimento: 0.85
  # Encolhimento: peso da empresa = n / (n + k).
  encolhimento_k: 3.0
  # Corte de seguranca no crescimento anual real.
  clip_min: -0.20
  clip_max: 0.35
  minimo_anos: 3
  # Backtest rolling-origin: primeira origem e tamanho minimo do treino.
  anos_minimo_backtest: 2014
  minimo_treino: 60
  minimo_obs_setor: 20
  # Ganho minimo de MAPE para tirar um setor do AR.
  margem_minima: 0.01
  # Premissas macro do proximo ano (usadas so pelo Modelo B).
  ibc_br_esperado: 0.02
  ipca_esperado: 0.04
  cambio_esperado: 0.0
  # Expectativas do Boletim Focus (SGS) para o ano a frente.
  # Variaveis independentes ex-ante do Modelo B.
  usar_focus: true
  ipca_exp_esperado: 0.04
  pib_exp_esperado: 0.02
  selic_exp_esperado: 0.11
  cambio_exp_esperado: 0.0
  # Modelos de machine learning que concorrem com o OLS no backtest. Usam
  # features extras (defasagens, tamanho do ativo, alavancagem, idade da serie,
  # media e volatilidade do crescimento) alem das variaveis dos modelos A/B.
  # Requer `pip install -e ".[ml]"`; `lstm`/`gru` exigem `.[deep]` (torch).
  # Modelo com biblioteca ausente e ignorado com aviso, sem quebrar o run.
  modelos_ml:
    - xgboost
    - lightgbm
    - catboost
    - mlp
    - lstm
    - gru
  # Hiperparametros conservadores: o painel tem ~2 mil linhas e ~150 empresas.
  ml_semente: 7
  ml_n_estimadores: 300
  ml_profundidade: 3
  ml_taxa: 0.05
  ml_janela: 3
  ml_epocas: 80
