[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valuation-empresas-brasileiras"
version = "1.0.0"
description = "Valuation de empresas brasileiras por fluxo de caixa descontado e dividendos descontados"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    # Motor do cache em parquet (provider e IPCA). Sem ele o pandas levanta
    # ImportError em to_parquet/read_parquet e a coleta inteira morre.
    "pyarrow>=15",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "tabulate>=0.9",
    "yfinance>=0.2.58,<2",
    "ipeadatapy",
    "sidrapy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.17,<0.18",
    "mypy>=1.11",
    "pandas-stubs",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
valuation = "valuation.pipeline.run:main"

[tool.setuptools]
packages = [
    "valuation",
    "valuation.domain",
    "valuation.data",
    "valuation.pipeline",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: requer acesso a internet",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebook", "codigos_rodando", "fundamentos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
files = ["valuation"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["yaml", "yfinance", "sidrapy", "ipeadatapy", "tabulate"]
ignore_missing_imports = true
