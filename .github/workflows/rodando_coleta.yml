name: Rodando Valuation Acoes

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta-valuation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # O pipeline completo leva ~10 min. Se algo pendurar, falha rapido em vez
    # de consumir o limite padrao de 6 h (que ja derrubou duas execucoes).
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # `ml` traz XGBoost/LightGBM/CatBoost/MLP. As redes recorrentes
          # (LSTM/GRU) ficam no extra `deep`: o torch e pesado e, sem ele, os
          # modelos sao apenas ignorados com aviso.
          python -m pip install -e ".[ml]"

      - name: Rodando Valuation
        run: python -m valuation.pipeline.run -v

      - name: Publicar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-valuation
          path: |
            dados/erros.csv
            dados/valores_valuations_acoes.csv
            README.md
          if-no-files-found: ignore

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add dados/ README.md
          if git diff --quiet --cached; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Coleta de valuation: $(date +'%Y-%m-%d')"
          git push

      # Roda mesmo quando a coleta quebra: nesse caso o modulo manda um email
      # [FALHA] com o resumo de dados/erros.csv. Sem os secrets configurados o
      # envio vira no-op, entao o fork/PR continua funcionando.
      - name: Enviar relatorio por email
        if: always()
        continue-on-error: true
        env:
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
        run: |
          python -m valuation.pipeline.email \
            --csv dados/valores_valuations_acoes.csv \
            --erros dados/erros.csv
