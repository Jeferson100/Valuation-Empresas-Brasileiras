name: Rodando Valuation Acoes

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta-valuation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Rodando Valuation
        run: python -m valuation.pipeline.run -v

      - name: Publicar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-valuation
          path: |
            dados/erros.csv
          if-no-files-found: ignore

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add dados/ README.md
          if git diff --quiet --cached; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Coleta de valuation: $(date +'%Y-%m-%d')"
          git push
