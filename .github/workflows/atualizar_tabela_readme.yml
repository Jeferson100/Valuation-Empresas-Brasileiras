name: Atualizar Tabela README

on:
  workflow_run:
    workflows: ["Rodando Valuation Acoes"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-valuation
  cancel-in-progress: false

jobs:
  update-readme:
    # So atualiza o README quando a coleta terminou com sucesso.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out o repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Rodar script para atualizar o README
        run: python -m codigos_rodando.atualizar_readme

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add README.md
          if git diff --quiet --cached; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Atualiza tabela do README: $(date +'%Y-%m-%d')"
          git push
